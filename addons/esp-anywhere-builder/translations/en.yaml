configuration:
  worker_url:
    name: Worker URL
    description: HTTPS endpoint of the ESP Anywhere staging Worker.
  public_artifact_base_url:
    name: Public artifact URL
    description: Public base URL used by devices to download immutable firmware.
  installation_id:
    name: Installation ID
    description: ESP Anywhere installation identity.
  worker_ha_token:
    name: Worker token
    description: Secret Home Assistant credential for this installation.
  builder_token:
    name: Builder token
    description: Random token of at least 32 characters used by the integration.
  firmware_signing_key:
    name: Firmware signing key
    description: PEM-encoded Ed25519 staging private key.
  signing_key_id:
    name: Signing key ID
    description: Identifier of the trusted staging public key.
